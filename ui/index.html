<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <link type="ico" rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="./src/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go-Fast CDN</title>
    <script>
      // Apply the stored theme before first paint so dark-mode users never see
      // a flash of the light palette. Keep the storage key in sync with
      // THEME_STORAGE_KEY in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("go-fast-cdn-theme");
          var theme =
            stored === "light" || stored === "dark" ? stored : null;
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* no-op: React applies the theme on mount */
        }
      })();
    </script>
  </head>
  <body class="min-w-full min-h-screen">
    <div id="root" class="w-screen min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
